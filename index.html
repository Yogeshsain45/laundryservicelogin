<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <!--Main container-->
    <div class="container">
        <!-- Left Section: Contains the laundry image -->
        <div class="left">
            <img src="laundryservice.webp" alt="laundryimg">
        </div>

        <!--Right section : contain the login form-->
        <div class="right">
            <!-- Login form content -->
            <div class="login-box">
                <!--login heading-->
                <h1>
                    Hello Again!
                </h1>

                <!--short description-->
                <p class="p1">
                    Welcome back! we missed you!
                </p>


                <!--Email section-->
                <div class="input-row">
                    <label for="email">Email</label>

                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <!--Password input section-->
                <div class="input-row">
                    <label for="password">Password</label>

                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <!-- Forgot password text -->
                <div class="forgot-password">
                    <a href="#">Forgot password</a>
                </div>

                <!-- Login button -->
                <button type="button">Login</button>

                <!-- Register option -->
                <p class="register-box">Not a member? <a href="#">Register Now</a></p>

            </div>
        </div>

    </div>

</body>

</html>
